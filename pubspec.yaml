name: codeit
description: "codeit — Standalone PRoot Linux IDE for Android. Self-contained mobile AI/Linux workspace powered by proot-distro."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  xterm: ^4.0.0
  shared_preferences: ^2.2.2
  dio: ^5.4.1
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  archive: ^3.4.10
  provider: ^6.1.1
  wakelock_plus: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
