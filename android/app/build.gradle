plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.farou9.codeit"
    compileSdk 36

    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Build libpty.so from src/main/jni/pty_bridge.c via CMake.
    // Output: build/intermediates/... -> packaged into APK lib/arm64-v8a/libpty.so
    externalNativeBuild {
        cmake {
            path file("src/main/jni/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'

            // Prebuilt executables (libproot.so, libbash.so, libtar.so) live here.
            // AGP packages every *.so under this tree into the APK's lib/<abi>/.
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    defaultConfig {
        applicationId "com.farou9.codeit"
        minSdk 24          // Android 7.0 — lowest with reliable PRoot
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            // Only 64-bit is supported: W^X enforcement; 32-bit deprecated on modern devices
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cFlags "-D_GNU_SOURCE -O2 -fPIC -Wall"
                arguments "-DANDROID_PLATFORM=android-24"
                targets "pty"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    // extractNativeLibs=true (also set in AndroidManifest) forces the OS to
    // extract every packaged .so to nativeLibraryDir as a real file — required
    // so we can exec() libproot.so / libbash.so / libtar.so.
    //
    // useLegacyPackaging=true  →  .so stored compressed in APK, extracted on install.
    // AGP maps this to android:extractNativeLibs=true during manifest merge,
    // overriding any conflicting default.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    implementation "androidx.core:core-ktx:1.12.0"
    // Foreground service
    implementation "androidx.lifecycle:lifecycle-service:2.7.0"
}
